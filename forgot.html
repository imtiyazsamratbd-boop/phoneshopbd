<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="form-body">
  
  <div class="form-container">
    <h2>Forgot Password</h2>
    <p style="color: #fff; text-align: center; margin-bottom: 20px;">Enter your email and we will send you a reset link</p>
    <form>
      <div class="input-group">
        <label>Email</label>
        <input type="email" placeholder="Enter your registered email" required>
      </div>

      <button type="submit" class="btn-submit">Send Reset Link</button>
      <p class="form-link">Remember password? <a href="login.html">Back to Login</a></p>
    </form>
  </div>

</body>
</html>
